version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: gin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: siang_gin
      TZ: Asia/Taipei
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gin-redis
    ports:
      - "6378:6379"
    networks:
      - gin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:4-management
    container_name: gin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Taipei
    ports:
      - "5672:5672"        # AMQP port
      - "15672:15672"      # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gin-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Go Gin Application
  app:
    build:
      context: ../../
      dockerfile: scripts/docker/Dockerfile
    container_name: gin-app
    ports:
      - "5001:5001"
    environment:
      - APP_MODE=debug
      - TZ=Asia/Taipei
    volumes:
      - ../../conf/env.docker.yaml:/app/conf/env.yaml:ro
      - ../../app_logs:/app/log
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gin-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Event Worker Service
  app-event:
    build:
      context: ../../
      dockerfile: scripts/docker/Dockerfile
    container_name: gin-app-event
    environment:
      - APP_MODE=debug
      - TZ=Asia/Taipei
      - CONFIG_PATH=/app/conf/
    volumes:
      - ../../conf/env.docker.yaml:/app/conf/env.yaml:ro
      - ../../app_logs:/app/log
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gin-network
    command: ["/app/event_worker"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    

networks:
  gin-network:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:
  app_logs:
